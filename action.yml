name: 'Cora AI Code Review'
description: 'AI-powered PR code review. Posts findings as comments and uploads SARIF. BYOK.'

author: 'codecoradev'
branding:
  icon: 'eye'
  color: 'blue'

inputs:
  base-branch:
    description: 'Base branch to compare against (default: origin/develop)'
    required: false
    default: 'origin/develop'
  severity:
    description: 'Minimum severity to report (info, minor, major, critical)'
    required: false
    default: 'major'
  cora-version:
    description: 'cora-code version tag (default: latest release)'
    required: false
    default: 'latest'
  upload-sarif:
    description: 'Upload SARIF to GitHub Code Scanning (default: true). Set to "false" to disable.'
    required: false
    default: 'true'
  cora-api-key:
    description: 'LLM API key'
    required: true
  cora-base-url:
    description: 'LLM API base URL'
    required: false
  cora-model:
    description: 'LLM model ID'
    required: false
  github-token:
    description: 'GitHub token for PR comments and SARIF upload (also used to resolve the latest cora-code release without hitting the anonymous API rate limit)'
    required: true
  require-signature:
    description: 'Fail unless the cora-code release carries a valid cosign signature (releases from v0.18.0 on). Default false: older releases without a signature still install, with a notice.'
    required: false
    default: 'false'

outputs:
  cora-version:
    description: 'The cora-code release that was installed'
    value: ${{ steps.resolve.outputs.VERSION }}
  signature-verified:
    description: '"true" when the release checksums were verified with cosign, "false" otherwise'
    value: ${{ steps.verify.outputs.signature-verified }}

runs:
  using: 'composite'
  steps:
    - name: Resolve cora-code version
      id: resolve
      shell: bash
      env:
        INPUT_VERSION: ${{ inputs.cora-version }}
        GH_TOKEN: ${{ inputs.github-token }}
      run: |
        valid_tag() { printf '%s' "$1" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+([-+.][0-9A-Za-z.-]+)?$'; }

        if [ "$INPUT_VERSION" = "latest" ]; then
          VERSION=""
          # 1) GitHub API, authenticated with the workflow token so the shared
          #    runner IP does not hit the anonymous 60 requests/hour limit.
          for i in 1 2 3; do
            AUTH=()
            [ -n "${GH_TOKEN:-}" ] && AUTH=(-H "Authorization: Bearer ${GH_TOKEN}")
            # pipefail-safe: prevent set -e from aborting on curl/python3 pipeline failure
            VERSION=$(curl -sfL --connect-timeout 10 --max-time 30 "${AUTH[@]}" \
              -H "Accept: application/vnd.github+json" \
              https://api.github.com/repos/codecoradev/cora-code/releases/latest \
              | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('tag_name', ''))" 2>/dev/null || true)
            if valid_tag "$VERSION"; then
              break
            fi
            VERSION=""
            echo "API attempt $i failed, retrying..."
            sleep 5
          done
          # 2) The /releases/latest redirect needs no API quota.
          if [ -z "$VERSION" ]; then
            echo "::warning::GitHub API did not return the latest cora-code release, trying the releases redirect"
            LOCATION=$(curl -sI --connect-timeout 10 --max-time 30 \
              https://github.com/codecoradev/cora-code/releases/latest 2>/dev/null \
              | tr -d '\r' | awk 'tolower($1)=="location:" {print $2}' | tail -1 || true)
            VERSION="${LOCATION##*/tag/}"
            valid_tag "$VERSION" || VERSION=""
          fi
          # 3) No silent fallback to an ancient release (it used to be v0.3.0): fail clearly.
          if [ -z "$VERSION" ]; then
            echo "::error::Could not resolve the latest cora-code release (GitHub API and redirect both failed). Re-run the job or pin 'cora-version' (e.g. v0.18.0)."
            exit 1
          fi
        else
          VERSION="$INPUT_VERSION"
          if ! valid_tag "$VERSION"; then
            echo "::error::Invalid cora-version '$VERSION' (expected a tag like v0.18.0)"
            exit 1
          fi
        fi
        echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"
        echo "Resolved cora-code version: $VERSION"

    - name: Download cora-code and verify checksums
      id: install
      shell: bash
      env:
        CORA_VERSION: ${{ steps.resolve.outputs.VERSION }}
        REQUIRE_SIGNATURE: ${{ inputs.require-signature }}
      run: |
        ARCH=$(uname -m)
        if [ "$ARCH" = "x86_64" ]; then
          ASSET="cora-x86_64-unknown-linux-gnu"
        elif [ "$ARCH" = "aarch64" ]; then
          ASSET="cora-aarch64-unknown-linux-gnu"
        else
          echo "Unsupported architecture: $ARCH"
          exit 1
        fi

        DOWNLOAD_URL="https://github.com/codecoradev/cora-code/releases/download/${CORA_VERSION}/${ASSET}-${CORA_VERSION}.tar.gz"
        CHECKSUM_URL="https://github.com/codecoradev/cora-code/releases/download/${CORA_VERSION}/checksums-sha256.txt"
        BUNDLE_URL="${CHECKSUM_URL}.sigstore.json"

        # Download tarball with retry + exponential backoff
        # Handles: CDN propagation delay on fresh releases, transient network errors, rate limits
        for i in 1 2 3 4 5; do
          rm -f /tmp/cora.tar.gz
          HTTP_CODE=$(curl --fail --show-error -sL --connect-timeout 15 --max-time 120 \
            -w '%{http_code}' -o /tmp/cora.tar.gz "$DOWNLOAD_URL" || echo "000")
          FILE_SIZE=$(wc -c < /tmp/cora.tar.gz 2>/dev/null || echo 0)
          echo "Download attempt $i: HTTP $HTTP_CODE, size ${FILE_SIZE} bytes"
          if [ "$HTTP_CODE" = "200" ] && [ "$FILE_SIZE" -gt 1000 ]; then
            break
          fi
          if [ "$i" -eq 5 ]; then
            echo "::error::Failed to download ${ASSET}-${CORA_VERSION}.tar.gz after 5 attempts (last HTTP $HTTP_CODE, ${FILE_SIZE} bytes)"
            exit 1
          fi
          BACKOFF=$((i * 10))
          echo "Attempt $i failed (HTTP $HTTP_CODE), retrying in ${BACKOFF}s..."
          sleep "$BACKOFF"
        done

        # Validate downloaded file is actual gzip
        FILE_TYPE=$(file -b /tmp/cora.tar.gz 2>/dev/null || echo "unknown")
        if ! echo "$FILE_TYPE" | grep -qi "gzip"; then
          echo "::error::Downloaded file is not gzip. Got: $FILE_TYPE (HTTP $HTTP_CODE, ${FILE_SIZE} bytes)"
          exit 1
        fi

        # Download and verify checksums
        CHECKSUM_HTTP=$(curl --fail --show-error -sL --connect-timeout 15 --max-time 30 \
          -w '%{http_code}' -o /tmp/cora-checksums.txt "$CHECKSUM_URL" || echo "000")
        if [ -f /tmp/cora-checksums.txt ] && [ -s /tmp/cora-checksums.txt ]; then
          EXPECTED=$(awk -v name="${ASSET}-${CORA_VERSION}.tar.gz" '$2 == name {print $1}' /tmp/cora-checksums.txt)
          ACTUAL=$(sha256sum /tmp/cora.tar.gz | awk '{print $1}')
          if [ -z "$EXPECTED" ]; then
            echo "::error::No checksum entry for ${ASSET}-${CORA_VERSION}.tar.gz — possible release asset mismatch"
            echo "Checksum file contents:"
            cat /tmp/cora-checksums.txt
            rm -f /tmp/cora-checksums.txt
            exit 1
          fi
          if [ "$EXPECTED" != "$ACTUAL" ]; then
            echo "::error::Checksum verification failed for ${ASSET}-${CORA_VERSION}.tar.gz"
            echo "Expected: $EXPECTED"
            echo "Actual:   $ACTUAL"
            rm -f /tmp/cora-checksums.txt
            exit 1
          fi
          echo "Checksum verified OK"
          # Keep the checksums file: the signature (next steps) covers its exact bytes.
        else
          echo "::error::Failed to download checksums file (HTTP $CHECKSUM_HTTP) — cannot verify binary integrity"
          rm -f /tmp/cora-checksums.txt
          exit 1
        fi

        # Release signature (cosign keyless, published from v0.18.0). One
        # signature over checksums-sha256.txt covers every archive.
        rm -f /tmp/cora-checksums.sigstore.json
        BUNDLE_HTTP=$(curl -sL --connect-timeout 15 --max-time 30 --max-filesize 1048576 \
          -w '%{http_code}' -o /tmp/cora-checksums.sigstore.json "$BUNDLE_URL" || echo "000")
        if [ "$BUNDLE_HTTP" = "200" ] && [ -s /tmp/cora-checksums.sigstore.json ]; then
          echo "has_bundle=true" >> "$GITHUB_OUTPUT"
        elif [ "$BUNDLE_HTTP" = "404" ]; then
          rm -f /tmp/cora-checksums.sigstore.json
          echo "has_bundle=false" >> "$GITHUB_OUTPUT"
        else
          rm -f /tmp/cora-checksums.sigstore.json
          if [ "$REQUIRE_SIGNATURE" = "true" ]; then
            echo "::error::Could not download the release signature (HTTP $BUNDLE_HTTP) and require-signature is true"
            exit 1
          fi
          echo "::warning::Could not download the release signature (HTTP $BUNDLE_HTTP); continuing with the checksum check only"
          echo "has_bundle=false" >> "$GITHUB_OUTPUT"
        fi

    - name: Set up cosign
      if: steps.install.outputs.has_bundle == 'true'
      uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1
      with:
        cosign-release: 'v2.6.5'

    - name: Verify release signature and install cora-code
      id: verify
      shell: bash
      env:
        CORA_VERSION: ${{ steps.resolve.outputs.VERSION }}
        HAS_BUNDLE: ${{ steps.install.outputs.has_bundle }}
        REQUIRE_SIGNATURE: ${{ inputs.require-signature }}
      run: |
        if [ "$HAS_BUNDLE" = "true" ]; then
          if ! cosign verify-blob \
            --bundle /tmp/cora-checksums.sigstore.json \
            --certificate-identity "https://github.com/codecoradev/cora-code/.github/workflows/release.yml@refs/tags/${CORA_VERSION}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            /tmp/cora-checksums.txt; then
            echo "::error::Signature verification FAILED for cora-code ${CORA_VERSION}. Refusing to install."
            rm -f /tmp/cora.tar.gz /tmp/cora-checksums.txt /tmp/cora-checksums.sigstore.json
            exit 1
          fi
          echo "Signature verified (cosign, release.yml@refs/tags/${CORA_VERSION})"
          echo "signature-verified=true" >> "$GITHUB_OUTPUT"
        else
          if [ "$REQUIRE_SIGNATURE" = "true" ]; then
            echo "::error::cora-code ${CORA_VERSION} has no release signature and require-signature is true"
            rm -f /tmp/cora.tar.gz /tmp/cora-checksums.txt
            exit 1
          fi
          echo "::notice::cora-code ${CORA_VERSION} has no cosign signature (releases before v0.18.0); installed after the checksum check only"
          echo "signature-verified=false" >> "$GITHUB_OUTPUT"
        fi
        rm -f /tmp/cora-checksums.txt /tmp/cora-checksums.sigstore.json

        tar xzf /tmp/cora.tar.gz -C /usr/local/bin cora
        rm -f /tmp/cora.tar.gz
        chmod +x /usr/local/bin/cora
        cora --version

    - name: Run cora review
      id: review
      shell: bash
      env:
        CORA_API_KEY: ${{ inputs.cora-api-key }}
        CORA_BASE_URL: ${{ inputs.cora-base-url }}
        CORA_MODEL: ${{ inputs.cora-model }}
        INPUT_BASE: ${{ inputs.base-branch }}
        INPUT_SEVERITY: ${{ inputs.severity }}
      run: |
        # Build the cora review command with retry logic and 600s timeout
        run_cora() {
          if [ ! -f .cora.yaml ]; then
            # Create CI config with 5MB diff limit and 600s timeout
            printf 'hook:\n  max_diff_size: 5242880\nllm:\n  timeout: 600\n' > .cora-ci.yaml
            CORA_CONFIG=".cora-ci.yaml" cora review \
              --base "$INPUT_BASE" \
              --format sarif \
              --severity "$INPUT_SEVERITY" \
              --quiet \
              > cora-results.sarif 2>cora-stderr.log
          else
            echo "Using project .cora.yaml for configuration"
            cora review \
              --base "$INPUT_BASE" \
              --format sarif \
              --severity "$INPUT_SEVERITY" \
              --quiet \
              > cora-results.sarif 2>cora-stderr.log
          fi
          return $?
        }

        # Retry up to 3 times with exponential backoff (10s, 30s, 60s)
        EXIT_CODE=1
        for ATTEMPT in 1 2 3; do
          run_cora
          EXIT_CODE=$?
          SARIF_BYTES=$(wc -c < cora-results.sarif 2>/dev/null || echo "0")

          echo "Attempt $ATTEMPT: exit=$EXIT_CODE, sarif_bytes=$SARIF_BYTES"

          # Detect cora's internal fallback SARIF (exit=0 but LLM call failed).
          # cora catches LLM errors in SARIF mode and produces a small fallback SARIF
          # with a single warning result containing "could not complete".
          # IMPORTANT: A legitimate empty review (no issues found) also has 0 rules
          # and 0 results. The ONLY reliable signal is the message text "could not complete"
          # in results[0]. We must NOT treat empty results as fallback.
          IS_FALLBACK=0
          if [ "$EXIT_CODE" -eq 0 ] && [ "$SARIF_BYTES" -gt 10 ]; then
            IS_FALLBACK=$(python3 -c "
            import json
            try:
                data = json.load(open('cora-results.sarif'))
                results = data.get('runs', [{}])[0].get('results', [])
                # Only check results — rules array is empty for BOTH
                # legitimate "no issues" AND fallback SARIF.
                if len(results) == 1:
                    msg = results[0].get('message', {}).get('text', '')
                    if 'could not complete' in msg.lower():
                        print(1)
                    else:
                        print(0)
                else:
                    print(0)
            except Exception:
                print(0)
            " 2>/dev/null || echo "0")
          fi

          if [ "$IS_FALLBACK" -eq 1 ]; then
            echo "::warning::Attempt $ATTEMPT: cora produced fallback SARIF (LLM error). Will retry."
            # Extract the actual error from the fallback SARIF for diagnostics
            FALLBACK_ERR=$(python3 -c "
            import json
            try:
                data = json.load(open('cora-results.sarif'))
                results = data.get('runs', [{}])[0].get('results', [])
                if results:
                    print(results[0].get('message', {}).get('text', '')[:200])
            except:
                pass
            " 2>/dev/null || echo "unknown")
            echo "  Fallback detail: $FALLBACK_ERR"
            EXIT_CODE=1  # Force retry by treating as failure
          fi

          # Success: cora exited 0 AND produced valid SARIF output (not a fallback)
          if [ "$EXIT_CODE" -eq 0 ] && [ "$SARIF_BYTES" -gt 10 ]; then
            break
          fi

          # On failure, show stderr and retry
          if [ -s cora-stderr.log ]; then
            echo "::warning::Attempt $ATTEMPT failed. Cora stderr: $(cat cora-stderr.log)"
          fi

          if [ "$ATTEMPT" -lt 3 ]; then
            SLEEP=$((ATTEMPT * 20))
            echo "Retrying in ${SLEEP}s..."
            sleep "$SLEEP"
            rm -f cora-results.sarif cora-stderr.log
          fi
        done

        echo "Cora review complete ($SARIF_BYTES bytes, exit=$EXIT_CODE, attempts=$ATTEMPT)"
        if [ -s cora-stderr.log ]; then
          echo "::warning::Cora stderr: $(cat cora-stderr.log)"
        fi

        # All retries exhausted and still no valid output — generate a fallback SARIF
        # so the workflow doesn't hard-fail on transient API issues.
        # If cora didn't exit cleanly, any SARIF we have is a fallback (not a real review)
        if [ "$EXIT_CODE" -ne 0 ]; then
          echo "::warning::Cora review could not complete after $ATTEMPT attempt(s). Generating fallback SARIF."
          cat > cora-results.sarif << 'SARIF_EOF'
        {
          "$schema": "https://raw.githubusercontent.com/oasis-tcs/sarif-spec/main/sarif-2.1/schema/sarif-schema-2.1.0.json",
          "version": "2.1.0",
          "runs": [{
            "tool": {
              "driver": {
                "name": "cora",
                "informationUri": "https://github.com/codecoradev/cora-code",
                "version": "0.4.0"
              }
            },
            "results": [{
              "level": "warning",
              "message": {
                "text": "Cora AI review could not complete — LLM API was unavailable after 3 retry attempts. Review was skipped; no code quality issues were found by the automated check."
              }
            }]
          }]
        }
        SARIF_EOF
        fi

    - name: Check SARIF for findings
      id: sarif-check
      if: inputs.upload-sarif == 'true'
      shell: bash
      run: |
        RESULTS=$(python3 -c "
        import json, sys
        try:
            data = json.load(open('cora-results.sarif'))
            results = data.get('runs', [{}])[0].get('results', [])
            print(len(results))
        except:
            print(0)
        " 2>/dev/null || echo "0")
        echo "results=$RESULTS" >> "$GITHUB_OUTPUT"
        if [ "$RESULTS" -gt 0 ]; then
          echo "SARIF contains $RESULTS finding(s) — will upload."
        else
          echo "SARIF has no findings — skipping upload."
        fi

    - name: Upload SARIF to GitHub Code Scanning
      if: inputs.upload-sarif == 'true' && steps.sarif-check.outputs.results > 0
      continue-on-error: true
      uses: github/codeql-action/upload-sarif@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4.37.3
      with:
        sarif_file: cora-results.sarif
        category: cora-review

    - name: Post PR comment
      if: always() && github.event_name == 'pull_request'
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      env:
        GH_TOKEN: ${{ inputs.github-token }}
      with:
        script: |
          const fs = require('fs');

          let sarifContent;
          try {
            sarifContent = JSON.parse(fs.readFileSync('cora-results.sarif', 'utf8'));
          } catch (e) {
            sarifContent = null;
          }

          let body;
          if (!sarifContent || !sarifContent.runs || sarifContent.runs.length === 0) {
            let fileSize = 0;
            try {
              fileSize = fs.statSync('cora-results.sarif').size;
            } catch (e) {
              fileSize = 0;
            }
            if (fileSize < 10) {
              body = `## 🔍 Cora AI Code Review\n\n⚠️ **Review could not complete.** Cora produced an empty result. Check the workflow logs for errors.\n\n---\n_Review powered by [cora-code](https://github.com/codecoradev/cora-code) · BYOK · MIT_`;
            } else {
              body = `## 🔍 Cora AI Code Review\n\n✅ **No issues found.** Code looks good!\n\n---\n_Review powered by [cora-code](https://github.com/codecoradev/cora-code) · BYOK · MIT_`;
            }
          } else {
            const results = sarifContent.runs[0].results || [];
            // Detect fallback SARIF: exactly 1 result with "could not complete" message.
            // Do NOT use rules.length === 0 — a legitimate empty review (code is clean)
            // also has 0 rules and 0 results. That's not a failure.
            const isFallback = results.length === 1
              && results[0].level === 'warning'
              && (results[0].message?.text || '').includes('could not complete');
            if (results.length === 0) {
              body = `## 🔍 Cora AI Code Review\n\n✅ **No issues found.** Code looks good!\n\n---\n_Review powered by [cora-code](https://github.com/codecoradev/cora-code) · BYOK · MIT_`;
            } else if (isFallback) {
              // Extract the actual error from cora's fallback SARIF message.
              // Format: "Cora AI review could not complete: {error}. Review was skipped..."
              const fallbackMsg = results[0].message?.text || '';
              const errMatch = fallbackMsg.match(/could not complete:\s*(.+?)\.\s*Review was skipped/i);
              const errorDetail = errMatch ? errMatch[1] : 'Unknown error — check workflow logs';
              body = `## 🔍 Cora AI Code Review\n\n⚠️ **Review could not complete.** LLM API error after retries: ${errorDetail}\n\n---\n_Review powered by [cora-code](https://github.com/codecoradev/cora-code) · BYOK · MIT_`;
            } else {
              const grouped = {};
              for (const r of results) {
                const sev = (r.level || 'note').charAt(0).toUpperCase() + (r.level || 'note').slice(1);
                if (!grouped[sev]) grouped[sev] = [];
                grouped[sev].push(r);
              }

              const severityOrder = ['Error', 'Warning', 'Note'];
              let table = '';

              for (const sev of severityOrder) {
                if (!grouped[sev]) continue;
                const icon = sev === 'Error' ? '🔴' : sev === 'Warning' ? '🟡' : '🔵';
                table += `\n### ${icon} ${sev} (${grouped[sev].length})\n\n`;
                for (const r of grouped[sev]) {
                  const loc = r.locations?.[0]?.physicalLocation;
                  const file = loc?.artifactLocation?.uri || 'unknown';
                  const line = loc?.region?.startLine || '?';
                  const msg = r.message?.text || r.message?.markdown || 'No message';
                  table += `- \`${file}:${line}\` — ${msg}\n`;
                }
              }

              const hasErrors = (grouped['Error'] || []).length > 0;
              const hasWarnings = (grouped['Warning'] || []).length > 0;
              const status = hasErrors ? '❌ **Blocked** — critical issues found.' :
                            hasWarnings ? '⚠️ **Review recommended** — warnings found.' :
                            '✅ **Passed** — only informational notes.';

              body = `## 🔍 Cora AI Code Review\n\n${status}\n${table}\n---\n_Review powered by [cora-code](https://github.com/codecoradev/cora-code) · BYOK · MIT_`;
            }
          }

          try {
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const existing = comments.find(c =>
              c.user.login === 'github-actions[bot]' &&
              c.body.startsWith('## 🔍 Cora AI Code Review')
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
          } catch (e) {
            // Fork PRs have read-only GITHUB_TOKEN — comment posting is not possible.
            // This is expected and non-blocking; the review itself still ran successfully.
            core.warning(`Skipping PR comment: ${e.message}`);
          }

    - name: Check for blocking issues
      if: always() && inputs.upload-sarif == 'true'
      shell: bash
      run: |
        if [ -f cora-results.sarif ]; then
          ERRORS=$(python3 -c "
          import json, sys
          try:
            data = json.load(open('cora-results.sarif'))
            results = data.get('runs', [{}])[0].get('results', [])
            errors = [r for r in results if r.get('level') == 'error']
            print(len(errors))
          except:
            print(0)
          " 2>/dev/null || echo "0")

          if [ "$ERRORS" -gt 0 ]; then
            echo "::error::Cora found $ERRORS blocking issue(s)."
            exit 1
          fi
        fi
        echo "No blocking issues."
